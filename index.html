let data={history:[],miss:[]};try{data=JSON.parse(localStorage.getItem('jagoStudyV7'))||data}catch{};function save(){try{localStorage.setItem('jagoStudyV7',JSON.stringify(data))}catch{}}let page='Dashboard',q=null,mode='Mixed',queue=[],checked=false,sp=null,rec=null,stream=null,recognition=null,timer=null,elapsed=0,started=0,run=0,recording=false;const tabs=['Dashboard','Writing Practice','Speaking Practice','Daily Challenge','My Progress','Study Review'];function go(p){if(recording)stopRecording();run++;clearInterval(timer);if(recognition)try{recognition.abort()}catch{};page=p;render()}function nav(){ $('nav').innerHTML=tabs.map(t=>`<button class="${page===t?'active':''}" onclick="go('${t}')">${t}</button>`).join('')};function render(){nav();let m=$('main');if(page==='Dashboard'){let w=data.history.filter(x=>x.kind==='Writing');m.innerHTML=`<div class="hero"><small>YOUR ENGLISH PRACTICE SPACE</small><h1>Build your English, one day at a time.</h1><p>Latihan singkat, skor akhir, pembahasan, dan kesempatan mencoba kembali.</p><div class="actions"><button onclick="go('Writing Practice')">10-Day Writing</button><button onclick="go('Speaking Practice')">10-Day Speaking</button></div></div><div class="grid"><div class="card"><small>Writing attempts</small><div class="stat">${w.length}</div></div><div class="card"><small>Jawaban cocok</small><div class="stat">${w.length?Math.round(w.filter(x=>x.ok).length/w.length*100):0}%</div></div><div class="card"><small>Speaking sessions</small><div class="stat">${data.history.filter(x=>x.kind==='Speaking').length}</div></div></div><div class="grid"><div class="card"><h2>Writing</h2><p>10 pertemuan · 450 soal campuran dengan noun phrases dan pembahasan pola.</p><button class="primary" onclick="go('Writing Practice')">Start writing</button></div><div class="card"><h2>Speaking</h2><p>10 pertemuan · topik adaptasi IELTS, rekaman dan evaluasi latihan.</p><button class="primary" onclick="go('Speaking Practice')">Start speaking</button></div></div><div class="card"><h3>Referensi & batasan</h3><p>Writing: cakupan Essential Grammar in Use, materi Modal dan DASN Jago Inggris. Vocabulary: pilihan kosakata English for Everyone. Speaking: topik dari bank IELTS Mei–Agustus 2024, dengan pertanyaan baru yang disederhanakan. Present perfect continuous dan beberapa latihan tambahan mengikuti silabus tutor. Comparison diasumsikan sebagai maksud “compression”.</p><p>Penilaian writing berbasis kunci, bukan AI; speaking berbasis transkrip dan indikator latihan, bukan skor IELTS atau penilaian pronunciation. Riwayat tersimpan pada browser ini saja.</p></div>`}else if(page==='Writing Practice'||page==='Daily Challenge'||page==='Study Review'){mode=page==='Study Review'?'Review':page==='Daily Challenge'?'Daily':'Mixed';queue=[];session=[];total=0;m.innerHTML=`<h1>${page}</h1><div class="card">${page==='Writing Practice'?`<label>Materi</label><select id="topic" onchange="mode=this.value;queue=[];session=[];total=0;nextQ()"><option>Mixed</option>${[...new Set(bank.map(x=>x.t))].map(t=>`<option>${t}</option>`).join('')}</select>`:''}<div id="exercise"></div></div>`;nextQ()}else if(page==='Speaking Practice'){m.innerHTML=`<h1>Speaking Practice</h1><div class="card"><label>Practice part</label><select id="part" onchange="newSpeak()"><option value="1">Part 1 · Short answers (30 sec)</option><option value="2">Part 2 · Talk (60 sec)</option><option value="3">Part 3 · Opinion (45 sec)</option></select><div id="speaking"></div></div>`;newSpeak()}else{m.innerHTML=`<h1>My Progress</h1><div class="card"><p>Riwayat lokal pada perangkat ini. Ekspor untuk dibagikan kepada tutor secara sukarela.</p><div class="actions"><button onclick="exportData()">Export CSV</button><button onclick="if(confirm('Hapus riwayat pada perangkat ini?')){data={history:[],miss:[]};save();render()}">Reset</button></div><div style="overflow:auto"><table><tr><th>Tanggal</th><th>Skill</th><th>Materi</th><th>Hasil</th></tr>${data.history.slice().reverse().map(x=> function norm(s){return s.toLowerCase().replace(/[’]/g,"'").replace(/\b(won't)\b/g,'will not').replace(/\b(can't)\b/g,'cannot').replace(/\b(\w+)n't\b/g,'$1 not').replace(/\b(i)'m\b/g,'$1 am').replace(/\b(you|we|they)'re\b/g,'$1 are').replace(/\b(i|you|we|they)'ve\b/g,'$1 have').replace(/\b(i|you|he|she|we|they)'ll\b/g,'$1 will').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim()}
